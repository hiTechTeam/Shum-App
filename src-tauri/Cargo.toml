[package]
name = "shum-app"
version = "0.1.12"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
shum-core = { git = "https://github.com/hiTechTeam/Shum-Core.git", rev = "f0853c76ef4f6a13c53af3f12dfdf3481f94991d" }
shum-store = { git = "https://github.com/hiTechTeam/Shum-Core.git", rev = "f0853c76ef4f6a13c53af3f12dfdf3481f94991d" }
shum-session = { git = "https://github.com/hiTechTeam/Shum-Core.git", rev = "f0853c76ef4f6a13c53af3f12dfdf3481f94991d" }
# System TLS (SChannel, Security, OpenSSL): rustls would rebuild ring, which does not cross-build for Windows ARM64.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
