[package]
name = "shum-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
shum-core = { git = "https://github.com/hiTechTeam/Shum-Core.git", rev = "f71e5d61216d5725880e3bc265d4501aa10885d7" }
shum-store = { git = "https://github.com/hiTechTeam/Shum-Core.git", rev = "f71e5d61216d5725880e3bc265d4501aa10885d7" }
shum-session = { git = "https://github.com/hiTechTeam/Shum-Core.git", rev = "f71e5d61216d5725880e3bc265d4501aa10885d7" }
