[package]
name = "shum-app"
version = "0.1.4"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
shum-core = { git = "https://github.com/hiTechTeam/Shum-Core.git", rev = "0f747a1fbad7d20e863ec6774920f1ee83a758bf" }
shum-store = { git = "https://github.com/hiTechTeam/Shum-Core.git", rev = "0f747a1fbad7d20e863ec6774920f1ee83a758bf" }
shum-session = { git = "https://github.com/hiTechTeam/Shum-Core.git", rev = "0f747a1fbad7d20e863ec6774920f1ee83a758bf" }
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
